<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Flipkart Ledger</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body><aside><div class="brand"><span class="brand-icon">F</span><div>Flipkart Ledger<small>Orders & settlements</small></div></div><nav aria-label="Main navigation"><button data-page="overview" class="active">Overview</button><button data-page="daily">Daily orders</button><button data-page="skus">SKU dashboard</button><button data-page="orders">Orders</button><button data-page="returns">Returns</button><button data-page="payments">Settlement ledger</button><button data-page="products">Products & costs</button><button data-page="imports">Import files</button></nav><div class="sidebar-footer">Local workspace<br><span>Downloaded reports only</span><a href="/api/backup">Download database backup</a></div></aside>
<main><header><div><div class="eyebrow">FLIPKART RECONCILIATION</div><h1 id="title">Overview</h1></div><span class="local-tag">Local data</span></header><div id="notice" role="status" aria-live="polite" hidden></div><section id="filters" class="filters"><label>Orders from<input id="start" type="date"></label><label>Orders through<input id="end" type="date"></label><label>Payments through<input id="asof" type="date"></label><label>SKU<select id="sku"><option value="">All SKUs</option></select></label><button id="apply">Apply</button><a id="export" class="secondary" href="/api/export">Export CSV</a></section><div id="content"><p>Loading your ledger…</p></div></main>
<dialog id="detail"><div class="dialog-head"><h2>Order details</h2><button id="close-dialog" class="secondary">Close</button></div><div id="detail-body"></div></dialog>
</body></html>
